name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Descargar gramáticas (único paso con red)
        run: uv run desglosa setup
      - name: Doctor
        run: uv run desglosa doctor
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
