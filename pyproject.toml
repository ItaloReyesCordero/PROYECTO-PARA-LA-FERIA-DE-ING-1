[project]
name = "desglosa"
version = "0.1.0"
description = "Mapas, diagramas de flujo y de secuencia interactivos a partir de tu código, sin IA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Italo Reyes Cordero", email = "75220834@continental.edu.pe" }
]
requires-python = ">=3.10"
keywords = ["diagrama de flujo", "flowchart", "tree-sitter", "ingenieria inversa", "uml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pathspec>=0.12",
    "sqlglot>=30,<31",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-language-pack>=1.22,<2",
]

[project.scripts]
desglosa = "desglosa.cli:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
