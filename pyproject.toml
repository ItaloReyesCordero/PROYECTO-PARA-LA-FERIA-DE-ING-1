[project]
name = "desglosa"
version = "0.1.0"
description = "Mapas, diagramas de flujo y de secuencia interactivos a partir de tu código, sin IA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Italo Reyes Cordero", email = "75220834@continental.edu.pe" }
]
requires-python = ">=3.10"
keywords = [
    "diagrama de flujo",
    "flowchart",
    "sequence diagram",
    "call graph",
    "code map",
    "tree-sitter",
    "ingenieria inversa",
    "uml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pathspec>=0.12",
    "sqlglot>=30,<31",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-language-pack>=1.22,<2",
]

[project.urls]
Homepage = "https://github.com/ItaloReyesCordero/PROYECTO-PARA-LA-FERIA-DE-ING-1"
Repository = "https://github.com/ItaloReyesCordero/PROYECTO-PARA-LA-FERIA-DE-ING-1"
Issues = "https://github.com/ItaloReyesCordero/PROYECTO-PARA-LA-FERIA-DE-ING-1/issues"
Changelog = "https://github.com/ItaloReyesCordero/PROYECTO-PARA-LA-FERIA-DE-ING-1/blob/main/CHANGELOG.md"

[project.scripts]
desglosa = "desglosa.cli:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
